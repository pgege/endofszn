services:
  postgres:
    image: postgres:16-alpine
    container_name: endofszn-postgres
    restart: unless-stopped
    labels:
      com.endofszn.project: "endofszn"
      com.endofszn.service: "postgres"
      com.endofszn.type: "infrastructure"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-endofszn}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: endofszn-redis
    restart: unless-stopped
    labels:
      com.endofszn.project: "endofszn"
      com.endofszn.service: "redis"
      com.endofszn.type: "infrastructure"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    labels:
      com.endofszn.project: "endofszn"
      com.endofszn.type: "data"
  redis_data:
    labels:
      com.endofszn.project: "endofszn"
      com.endofszn.type: "data"

networks:
  default:
    name: endofszn-network
    labels:
      com.endofszn.project: "endofszn"
