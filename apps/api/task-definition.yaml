family: endofszn-__ENVIRONMENT__-api
networkMode: awsvpc
requiresCompatibilities:
  - FARGATE
cpu: "__CPU__"
memory: "__MEMORY__"
executionRoleArn: "__EXECUTION_ROLE_ARN__"
taskRoleArn: "__TASK_ROLE_ARN__"

containerDefinitions:
  - name: api
    image: "__IMAGE_URI__"
    essential: true
    portMappings:
      - containerPort: __CONTAINER_PORT__
        protocol: tcp
        name: api
    logConfiguration:
      logDriver: awslogs
      options:
        awslogs-group: "/ecs/endofszn-__ENVIRONMENT__-api"
        awslogs-region: "__AWS_REGION__"
        awslogs-stream-prefix: api
    secrets:
      - name: DATABASE_URL
        valueFrom: "arn:aws:secretsmanager:__AWS_REGION__:__AWS_ACCOUNT_ID__:secret:endofszn-__ENVIRONMENT__:DATABASE_URL::"
      - name: API_CORS_ORIGINS
        valueFrom: "arn:aws:secretsmanager:__AWS_REGION__:__AWS_ACCOUNT_ID__:secret:endofszn-__ENVIRONMENT__:API_CORS_ORIGINS::"
      - name: REDIS_HOST
        valueFrom: "arn:aws:secretsmanager:__AWS_REGION__:__AWS_ACCOUNT_ID__:secret:endofszn-__ENVIRONMENT__:REDIS_HOST::"
      - name: REDIS_PORT
        valueFrom: "arn:aws:secretsmanager:__AWS_REGION__:__AWS_ACCOUNT_ID__:secret:endofszn-__ENVIRONMENT__:REDIS_PORT::"
      - name: MEDUSA_PUBLISHABLE_API_KEY
        valueFrom: "arn:aws:secretsmanager:__AWS_REGION__:__AWS_ACCOUNT_ID__:secret:endofszn-__ENVIRONMENT__:MEDUSA_PUBLISHABLE_API_KEY::"
    environment:
      - name: NODE_ENV
        value: production
      - name: API_PORT
        value: "__CONTAINER_PORT__"
      - name: MEDUSA_HOST
        value: "medusa.endofszn-__ENVIRONMENT__.local"
      - name: MEDUSA_PORT
        value: "9000"
      - name: MEDUSA_PROTOCOL
        value: "http"
