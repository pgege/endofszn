name: Deploy API

on:
  push:
    branches:
      - dev
      - staging
      - prod
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-deploy.yml'

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get stack outputs
        id: stacks
        run: |
          ENV="${{ github.ref_name }}"
          
          REPO_URI=$(aws cloudformation describe-stacks \
            --stack-name "endofszn-api-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='APIRepositoryUri'].OutputValue" \
            --output text)
          
          CLUSTER_NAME=$(aws cloudformation describe-stacks \
            --stack-name "endofszn-network-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='ECSClusterName'].OutputValue" \
            --output text)
          
          EXECUTION_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "endofszn-network-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='ECSTaskExecutionRoleArn'].OutputValue" \
            --output text)
          
          TASK_ROLE=$(aws cloudformation describe-stacks \
            --stack-name "endofszn-network-$ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='ECSTaskRoleArn'].OutputValue" \
            --output text)
          
          echo "repo_uri=$REPO_URI" >> $GITHUB_OUTPUT
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT
          echo "execution_role=$EXECUTION_ROLE" >> $GITHUB_OUTPUT
          echo "task_role=$TASK_ROLE" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ steps.stacks.outputs.repo_uri }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" -f apps/api/Dockerfile .
          docker push "$IMAGE_URI"
          docker tag "$IMAGE_URI" "${{ steps.stacks.outputs.repo_uri }}:latest"
          docker push "${{ steps.stacks.outputs.repo_uri }}:latest"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Register task definition
        id: task-def
        run: |
          ENV="${{ github.ref_name }}"
          AWS_ACCOUNT_ID="${{ secrets.AWS_ACCOUNT_ID }}"
          AWS_REGION="${{ vars.AWS_REGION }}"
          IMAGE_URI="${{ steps.stacks.outputs.repo_uri }}:${{ github.sha }}"
          
          TASK_DEF=$(cat apps/api/task-definition.json | \
            sed "s|__ENVIRONMENT__|$ENV|g" | \
            sed "s|__CPU__|256|g" | \
            sed "s|__MEMORY__|512|g" | \
            sed "s|__IMAGE_URI__|$IMAGE_URI|g" | \
            sed "s|__EXECUTION_ROLE_ARN__|${{ steps.stacks.outputs.execution_role }}|g" | \
            sed "s|__TASK_ROLE_ARN__|${{ steps.stacks.outputs.task_role }}|g" | \
            sed "s|__AWS_REGION__|$AWS_REGION|g" | \
            sed "s|__AWS_ACCOUNT_ID__|$AWS_ACCOUNT_ID|g" | \
            sed "s|\"__CONTAINER_PORT__\"|3000|g")
          
          TASK_DEF_ARN=$(echo "$TASK_DEF" | aws ecs register-task-definition \
            --cli-input-json file:///dev/stdin \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)
          
          echo "task_def_arn=$TASK_DEF_ARN" >> $GITHUB_OUTPUT

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ steps.stacks.outputs.cluster_name }}" \
            --service "endofszn-${{ github.ref_name }}-api" \
            --task-definition "${{ steps.task-def.outputs.task_def_arn }}" \
            --desired-count 1 \
            --force-new-deployment

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ steps.stacks.outputs.cluster_name }}" \
            --services "endofszn-${{ github.ref_name }}-api"
